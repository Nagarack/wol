name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Clé de signature (secrets GitHub)
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > app/mon-pc.keystore
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret KEYSTORE_B64 absent : APK de test signé avec une clé temporaire, aucune release publiée."
          fi
      - run: gradle assembleDebug --no-daemon
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: MonPC-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publier la release (mise à jour automatique de l'appli)
        if: github.ref == 'refs/heads/main' && env.SIGNED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VC=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          cp app/build/outputs/apk/debug/app-debug.apk MonPC.apk
          if gh release view "v$VC" >/dev/null 2>&1; then
            gh release upload "v$VC" MonPC.apk --clobber
          else
            gh release create "v$VC" MonPC.apk --title "Version $VC" --notes "APK Mon PC (versionCode $VC)"
          fi
